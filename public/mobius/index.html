<script>/* Pure data, validation, measurement and layout functions. No network or AI calls. */
(function(root, factory){const api=factory();if(typeof module==='object'&&module.exports)module.exports=api;else root.FlowCore=api;})(typeof window!=='undefined'?window:globalThis, function(){
'use strict';
const STATUS=['待访谈','现场观察','客户确认','样本验证','假设示例'];
const KINDS=['人工处理','系统处理','审批确认','外部等待'];
const METHODS=['待判断','流程简化','普通自动化','AI辅助','保留人工'];
const METRICS=['volume','minutes','people','hourlyRate','reworkRate','reworkMinutes','externalCost','waitHours'];
const id=prefix=>`${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
const clone=x=>JSON.parse(JSON.stringify(x));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const validNum=x=>typeof x==='number'&&Number.isFinite(x)&&x>=0&&x<=1e12;
const fmt=(x,d=0)=>x===null||x===undefined||!Number.isFinite(x)?'待采集':new Intl.NumberFormat('zh-CN',{maximumFractionDigits:d}).format(x);
const newNode=(role,title='新增环节')=>({id:id('step'),title,role,kind:'人工处理',description:'',inputs:'',outputs:'',system:'',pain:'',evidenceStatus:'待访谈',evidence:'',metrics:Object.fromEntries(METRICS.map(k=>[k,null])),proposal:{method:'待判断',targetMinutes:null,priority:'待评估',notes:''},position:{x:70,y:80}});
function measure(node){
 const m=node.metrics||{}, core=['volume','minutes','people','hourlyRate'].every(k=>validNum(m[k]));
 const baseHours=core?m.volume*m.minutes*m.people/60:null;
 const reworkKnown=validNum(m.reworkRate)&&(m.reworkRate===0||validNum(m.reworkMinutes));
 const reworkHours=core&&reworkKnown?m.volume*m.people*(m.reworkRate/100)*(m.reworkMinutes||0)/60:null;
 const labor=core?baseHours*m.hourlyRate:null;
 const total=core&&reworkKnown&&validNum(m.externalCost)?(baseHours+reworkHours)*m.hourlyRate+m.externalCost:null;
 const target=node.proposal?.targetMinutes;
 const savedHours=core&&validNum(target)?m.volume*m.people*(m.minutes-target)/60:null;
 const savedValue=savedHours!==null?savedHours*m.hourlyRate:null;
 return {core,complete:total!==null,baseHours,reworkHours,labor,total,savedHours,savedValue};
}
function totals(flow){
 const all=flow.nodes.map(n=>({node:n,...measure(n)})), known=all.filter(x=>x.complete), base=all.filter(x=>x.core), targets=all.filter(x=>x.savedValue!==null);
 const sum=(arr,key)=>arr.length?arr.reduce((s,x)=>s+x[key],0):null;
 return {totalNodes:all.length,complete:known.length,baseCount:base.length,targetCount:targets.length,verified:flow.nodes.filter(n=>['客户确认','样本验证'].includes(n.evidenceStatus)).length,total:sum(known,'total'),baseLabor:sum(base,'labor'),hours:sum(base,'baseHours'),savedHours:sum(targets,'savedHours'),savedValue:sum(targets,'savedValue'),rows:all};
}
function parseNumber(value){if(value===''||value===null||value===undefined)return null;const n=Number(value);if(!Number.isFinite(n)||n<0||n>1e12)throw Error('请输入不小于 0 的有效数字；未知项请留空。');return n;}
function str(v,name,max=4000){if(v===undefined||v===null)return '';if(typeof v!=='string')throw Error(`${name} 必须是文字。`);if(v.length>max)throw Error(`${name} 超过 ${max} 字限制。`);return v;}
function normalizeFlow(raw){
 if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('流程必须是 JSON 对象。');
 if(raw.schemaVersion!==undefined&&raw.schemaVersion!==1)throw Error('当前仅支持 schemaVersion: 1。');
 if(!Array.isArray(raw.nodes)||raw.nodes.length>100)throw Error('nodes 必须是数组，每条流程最多 100 个环节。');
 if(!Array.isArray(raw.roles)||raw.roles.length<1||raw.roles.length>12)throw Error('roles 需要 1–12 个不同的部门／角色名称。');
 const roles=raw.roles.map(x=>str(x,'角色名称',40).trim());
 if(roles.some(x=>!x)||new Set(roles).size!==roles.length)throw Error('角色名称不能为空或重复。');
 const nodes=raw.nodes.map(r=>{
  if(!r||typeof r!=='object')throw Error('存在无效环节。');
  const nid=str(r.id,'环节 ID',100).trim(),title=str(r.title,'环节名称',100).trim();
  if(!nid||!title)throw Error('每个环节必须有 id 和 title。');
  if(!roles.includes(r.role))throw Error(`环节「${title}」的角色不在 roles 中。`);
  if(r.kind&&!KINDS.includes(r.kind))throw Error(`不支持的环节类型：${r.kind}`);
  if(r.evidenceStatus&&!STATUS.includes(r.evidenceStatus))throw Error(`不支持的证据状态：${r.evidenceStatus}`);
  const n=newNode(r.role,title);n.id=nid;n.kind=r.kind||'人工处理';n.evidenceStatus=r.evidenceStatus||'待访谈';
  for(const k of ['description','inputs','outputs','system','pain','evidence'])n[k]=str(r[k],k);
  for(const k of METRICS){const v=r.metrics?.[k];if(v!==undefined&&v!==null&&!validNum(v))throw Error(`「${title}」的 ${k} 必须是非负数字或 null。`);n.metrics[k]=v??null;}
  if(n.metrics.reworkRate>100)throw Error('返工比例不能超过 100%。多次返工请合并到平均返工分钟。');
  if(n.metrics.people!==null&&n.metrics.people<1)throw Error('参与人数至少为 1；未知请填 null。');
  const p=r.proposal||{};if(p.targetMinutes!==undefined&&p.targetMinutes!==null&&!validNum(p.targetMinutes))throw Error('目标处理时间必须是非负数字或 null。');

  const pos=r.position;if(pos&&Number.isFinite(pos.x)&&Number.isFinite(pos.y)&&Math.abs(pos.x)<30000&&Math.abs(pos.y)<30000)n.position={x:pos.x,y:pos.y};else n.position=null;
  return n;
 });
 if(new Set(nodes.map(n=>n.id)).size!==nodes.length)throw Error('存在重复的环节 ID。');
 const ids=new Set(nodes.map(n=>n.id));
 if(raw.edges!==undefined&&(!Array.isArray(raw.edges)||raw.edges.length>300))throw Error('edges 必须是数组，最多 300 条连线。');

      step('join', 's4', 'join', ['e2', 'e3'], `「${title('s2')}」和「${title('s3')}」准备的资料，在「${title('s4')}」汇合核对。`, '核对时必须同时拿到哪些资料？差异通常是什么？', '核对任务')

      step('check-again', 's4', 'recheck', ['e5'], `补充资料后回到「${title('s4')}」再次核对。本次只示意一次补件，不代表真实返工次数。`, '什么条件满足后才能继续？还有哪些情况会再次退回？', '补齐后的核对任务')

  function validateScenario(flow, scenario) {

      if (!s.key || keys.has(s.key)) errors.push(`步骤 ${index + 1} 的标识缺失或重复。`);
      keys.add(s.key);
      if (!KINDS.has(s.kind)) errors.push(`步骤 ${index + 1} 的类型无效。`);
      if (!Array.isArray(s.edgeIds)) { errors.push(`步骤 ${index + 1} 的连线列表无效。`); seen.add(s.nodeId); return; }
      if (new Set(s.edgeIds).size !== s.edgeIds.length) errors.push(`步骤 ${index + 1} 重复引用连线。`);
      if (s.kind === 'parallel' && s.edgeIds.length) errors.push('独立资料准备不能伪装成上一环节的交接。');
      if (index === 0 && s.edgeIds.length) errors.push('起始步骤不能引用尚未准备的输入。');
      if (s.kind === 'join' && s.edgeIds.length < 2) errors.push('汇合步骤需要明确引用多份输入。');
      if (index > 0 && s.kind !== 'parallel' && s.kind !== 'join' && s.edgeIds.length !== 1) errors.push(`步骤 ${index + 1} 缺少明确的交接连线。`);

        if (e.target !== s.nodeId) errors.push(`连线 ${id} 没有指向当前环节。`);
        if (!nodes.has(e.source) || !seen.has(e.source)) errors.push(`连线 ${id} 的来源尚未准备或不存在。`);

    if (!count) return 0;
    const current = Number.isFinite(index) ? Math.trunc(index) : 0;
    const change = Number.isFinite(delta) ? Math.trunc(delta) : 0;
    return Math.max(0, Math.min(count - 1, current + change));
  }

  function immutableFieldUpdate(project, nodeId, patch) {
    const C = getCore();
    if (!C || typeof C.normalizeProject !== 'function') throw Error('请先加载 FlowCore。');
    if (!patch || typeof patch !== 'object' || Array.isArray(patch)) throw Error('环节修改必须是对象。');
    for (const key of Object.keys(patch)) if (!EDITABLE.has(key)) throw Error(`不允许修改字段：${key}`);
    const result = snapshot(project);
    const flow = result.flows?.find(f => f.id === result.activeFlowId) || result.flows?.[0];
    const node = flow?.nodes?.find(n => n.id === nodeId);
    if (!node) throw Error('当前流程中找不到这个环节。');
    if (['客户确认', '样本验证'].includes(patch.evidenceStatus) && (typeof patch.evidence !== 'string' || !patch.evidence.trim())) throw Error('确认状态需要本次明确提供证据；请填写确认人、时间或样本来源。');
    if (patch.metrics !== undefined) {
      if (!patch.metrics || typeof patch.metrics !== 'object' || Array.isArray(patch.metrics)) throw Error('测量值必须是对象。');
      for (const key of Object.keys(patch.metrics)) if (!C.METRICS.includes(key)) throw Error(`不支持的测量字段：${key}`);
    }
    const changes = snapshot(patch);
    if (Object.prototype.hasOwnProperty.call(changes, 'role')) {
      if (typeof changes.role !== 'string' || !changes.role.trim()) throw Error('负责岗位不能为空。');
      changes.role = changes.role.trim();
      if (!flow.roles.includes(changes.role)) {
        if (flow.roles.length >= 12) throw Error('每条流程最多保留 12 个岗位。');
        flow.roles.push(changes.role);
      }
    }
    if (changes.metrics) changes.metrics = { ...node.metrics, ...changes.metrics };
    Object.assign(node, changes);
    if (!Object.prototype.hasOwnProperty.call(patch, 'evidenceStatus')) node.evidenceStatus = '待访谈';
    const normalized = C.normalizeProject(result);
    const normalizedFlow = normalized.flows.find(f => f.id === flow.id);
    const normalizedNode = normalizedFlow.nodes.find(n => n.id === nodeId);
    // The canonical normalizer validates every numeric constraint. Retain unrelated
    // project/flow/node fields instead of losing future extension data to normalization.
    const retainedMetrics = { ...node.metrics, ...normalizedNode.metrics };
    Object.assign(node, normalizedNode, { metrics: retainedMetrics });
    return result;
  }

  return { makeScenario, validateScenario, moveStep, snapshot, immutableFieldUpdate };
});

    if (list.length > limits.records) throw Error(`讨论记录有 ${list.length} 条，超过 ${limits.records} 条上限。为避免丢失，未导入；请先整理记录。`);

      if (!n || typeof n.text !== 'string') return null;
      if (n.text.length > limits.recordText) throw Error(`第 ${i + 1} 条讨论记录超过 ${limits.recordText} 字。为避免截断，未导入。`);

      : `工作稿将达到 ${formatBytes(cap.bytes)}，超过 ${formatBytes(limits.stateBytes)} 上限，这次修改未应用。请先导出完整备份，精简长段文字后再继续。`;

 $('edit-form').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target);try{const evidenceStatus=String(fd.get('evidenceStatus')),ev=String(fd.get('evidence')).trim();if(['客户确认','样本验证'].includes(evidenceStatus)&&!ev)throw Error('请填写本次确认人、日期或样本来源，再使用确认状态。');const patch={title:String(fd.get('title')).trim(),role:String(fd.get('role')).trim(),description:String(fd.get('description')),inputs:String(fd.get('inputs')),outputs:String(fd.get('outputs')),system:String(fd.get('system')),pain:String(fd.get('pain')),metrics:{minutes:C.parseNumber(fd.get('minutes')),waitHours:C.parseNumber(fd.get('waitHours'))},evidenceStatus,evidence:ev||`现场修正工作稿 · ${niceDate(new Date().toISOString())}；待客户确认。`};if(!patch.title)throw Error('环节名称不能为空。');const p=W.immutableFieldUpdate(state.project,n.id,patch);checkpoint();state.project=p;addRecord('修正',`「${n.title}」已更新。负责：${patch.role}；${patch.description||'实际动作仍待补充'}；依据：${evidenceStatus}。`,{...n,title:patch.title});if(!state.session.discussed.includes(discussionKey(n.id)))state.session.discussed.push(discussionKey(n.id));if(!fits())return;closeModal();persist('已保存修正，画面与环节说明已同步。');}catch(e){error(e.message);}});

function openProject(){openModal('这次一起看什么','先聚焦一条流程，把范围说清楚。',`<form id="project-form"><div id="form-error" class="form-error" role="alert"></div>${field('company','客户名称',state.project.company,'input','required maxlength="120"')}${field('name','当前流程',flow().name,'input','required maxlength="100"')}${field('scope','本次讨论范围',state.project.scope,'textarea','maxlength="2000"')}${state.project.flows.length>1?`<label class="field"><span>切换已有流程</span><select name="activeFlowId">${state.project.flows.map(f=>`<option value="${E(f.id)}" ${f.id===flow().id?'selected':''}>${E(f.name)}</option>`).join('')}</select></label>`:''}</form>`,`<button class="button quiet" data-close>取消</button><button class="button primary" form="project-form" type="submit">保存范围</button>`);$('project-form').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target);try{const p=clone(state.project);p.company=String(fd.get('company')).trim();p.scope=String(fd.get('scope'));p.flows.find(f=>f.id===p.activeFlowId).name=String(fd.get('name')).trim();if(!p.company||!p.flows.find(f=>f.id===p.activeFlowId).name)throw Error('请填写客户与流程名称。');if(fd.get('activeFlowId'))p.activeFlowId=String(fd.get('activeFlowId'));const valid=C.normalizeProject(p);checkpoint();state.project=valid;addRecord('备注','更新讨论范围：'+p.scope,null);if(!fits())return;state.index=0;state.selectedId=flow().nodes[0]?.id||'';state.exploring=false;closeModal();persist();}catch(e){error(e.message);}});}

function openAddEdge(){const f=flow(),options=f.nodes.map(n=>`<option value="${E(n.id)}">${E(n.title)}</option>`).join('');openModal('这份资料，交给谁','按客户描述连接两个环节。',`<form id="edge-form"><div id="form-error" class="form-error" role="alert"></div><label class="field"><span>从哪个环节</span><select name="source">${options}</select></label><label class="field"><span>交给哪个环节</span><select name="target">${options}</select></label>${field('label','什么资料 / 什么条件','','input','required maxlength="100" placeholder="例如：销售汇总 / 有差异时退回"')}</form>`,`<button class="button quiet" data-close>取消</button><button class="button primary" form="edge-form" type="submit">保存连接</button>`);$('edge-form').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target);try{const p=clone(state.project),f=p.flows.find(x=>x.id===p.activeFlowId),edge={id:C.id('edge'),source:String(fd.get('source')),target:String(fd.get('target')),label:String(fd.get('label')).trim()};f.edges.push(edge);const valid=C.normalizeProject(p);checkpoint();state.project=valid;addRecord('结构','新增资料交接：'+edge.label,null);if(!fits())return;closeModal();persist('已连接，顺序和条件仍需客户核实。');}catch(e){error(e.message);}});}

function makeSummary(){const f=flow(),lines=[`# ${state.project.company}｜${f.name}`,`现场讨论工作稿 v${state.session.revision}`,`导出时间：${new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})}（北京时间）`,'','> 流程与路径按各环节证据状态解释；示意动画不代表真实业务进展、耗时或收益。已讨论不等于客户确认，也不构成合同或项目验收。','','## 本次范围',state.project.scope||'待确认','','## 环节记录'];const cell=s=>String(s??'待了解').replace(/\|/g,'／').replace(/\n/g,'；');lines.push('|环节|负责岗位|输入|实际动作|输出|证据状态|依据|','|---|---|---|---|---|---|---|');f.nodes.forEach(n=>lines.push(`|${cell(n.title)}|${cell(n.role)}|${cell(n.inputs)}|${cell(n.description||'待了解')}|${cell(n.outputs)}|${cell(n.evidenceStatus)}|${cell(n.evidence)}|`));lines.push('','## 资料流转');f.edges.forEach(e=>lines.push(`- ${f.nodes.find(n=>n.id===e.source)?.title} → ${f.nodes.find(n=>n.id===e.target)?.title}：${e.label||'条件待确认'}`));lines.push('','## 本次新增记录');state.session.notes.forEach(n=>lines.push(`- ${niceDate(n.at)} [${n.type}] ${n.nodeTitle?'「'+n.nodeTitle+'」 ':''}${n.text}`));if(!state.session.notes.length)lines.push('尚未记录。');lines.push('','## 待确认问题');state.project.questions.forEach(q=>lines.push(`- [${q.done?'x':' '}] ${q.text}`));lines.push('','## 已录入耗时','未录入保持未知；主动操作和等待分开，不由播放秒数推导。');f.nodes.forEach(n=>{if(n.metrics.minutes!==null||n.metrics.waitHours!==null)lines.push(`- ${n.title}：主动操作 ${C.fmt(n.metrics.minutes)} 分钟 / 次 / 人；等待 ${C.fmt(n.metrics.waitHours)} 小时 / 次；依据 ${n.evidenceStatus}。`);});return lines.join('\n');}
function openFiles(){openModal('带走这次讨论','记录保存在当前浏览器。结束前，另存一份备份。',`<div class="format-list"><button class="format-choice" data-action="export-json"><span class="format-icon">JSON</span><span><strong>保存完整讨论备份</strong><small>保留流程、问题与修正记录；下次在这里继续。</small></span><span class="arrow">↗</span></button><button class="format-choice" data-action="export-md"><span class="format-icon">文档</span><span><strong>导出会议纪要</strong><small>Markdown 文档，可交给 Codex 整理或放入 Notion。</small></span><span class="arrow">↗</span></button><button class="format-choice" data-action="export-v1"><span class="format-icon">流程</span><span><strong>交给原工作台继续分析</strong><small>导出 schema 1 工作区，继续核对成本与方案。</small></span><span class="arrow">↗</span></button><button class="format-choice" data-action="import"><span class="format-icon">导入</span><span><strong>继续已有的客户流程</strong><small>支持完整讨论备份、v0.2 工作区或单条流程 JSON。</small></span><span class="arrow">↗</span></button>${state.brokenStorage?'<button class="format-choice" data-action="recover"><span class="format-icon">恢复</span><span><strong>保存无法读取的原记录</strong><small>下载原文留作恢复；旧记录仍保留，不会被当前工作稿覆盖。</small></span></button>':''}</div>`,'<button class="button quiet" data-close>返回沙盘</button>');}
function openSummary(){const f=flow(),notes=state.session.notes,qs=state.project.questions.filter(q=>!q.done);openModal('今天，我们聊清楚了什么','工作稿 v'+state.session.revision+' · 已讨论不等于已验证',`<div class="summary-stats"><div><strong>${state.session.discussed.filter(id=>f.nodes.some(n=>discussionKey(n.id)===id)).length}<span style="display:inline;font-size:12px"> / ${f.nodes.length}</span></strong><span>已讨论环节</span></div><div><strong>${notes.filter(n=>n.type==='修正'||n.type==='结构').length}</strong><span>现场修正</span></div><div><strong>${qs.length}</strong><span>待确认问题</span></div></div><section class="summary-section"><h3>本次记录</h3>${notes.length?notes.slice().reverse().map(n=>`<div class="record-item"><span class="record-type">${E(n.type)}</span><div><p>${E(n.text)}</p><small>${E(n.nodeTitle||'整体流程')} · ${E(niceDate(n.at))}</small></div></div>`).join(''):'<p class="muted-text">还没有记录。点工作台，修改实际做法或记下客户的问题。</p>'}</section><section class="summary-section"><h3>需要继续核实</h3>${state.project.questions.map(q=>`<label class="record-item"><input class="record-check" type="checkbox" data-question="${E(q.id)}" ${q.done?'checked':''}><div><p>${E(q.text)}</p><small>${q.done?'已标记跟进完成':'完成核实后勾选；不会自动确认流程'}</small></div></label>`).join('')||'<p class="muted-text">还没有待确认问题。</p>'}</section><p class="note-box">点击过、播放过不会自动算作已讨论。只有你保存修正或记录时，才加入本次讨论清单。</p>`,`<button class="button quiet" data-action="export-md">导出纪要</button><button class="button primary" data-action="export-json">保存完整备份</button>`);}
function importText(text){try{const draft=decode(text);importDraft=draft;const p=draft.project;openModal('导入前，先看一眼',importDraft.kind,`<p class="note-box">客户：${E(p.company)}<br>${p.flows.length} 条流程，共 ${p.flows.reduce((s,f)=>s+f.nodes.length,0)} 个环节。<br>${importDraft.kind==='新增流程'?'将新增这条流程，现有内容保留。':'将替换当前工作稿；可以撤销。建议先下载当前备份。'}</p><p class="muted-text">预设销售对账动画仅对原模板有效。其他流程可以查看、编辑和记录，不会自动猜测演示路径。</p>`,`<button class="button quiet" data-action="export-json">先备份当前内容</button><button class="button primary" id="confirm-import">确认导入</button>`);$('confirm-import').onclick=()=>{checkpoint();state.project=draft.project;state.session=draft.session;state.index=0;state.selectedId=flow().nodes[0]?.id||'';state.exploring=false;closeModal();persist('已导入。请先核对客户、流程和信息依据。');};}catch(e){toast(e.message,7000);}}
document.addEventListener('click',e=>{
 const close=e.target.closest('[data-close]');if(close){closeModal();return;}
 const selected=e.target.closest('[data-node],[data-select]');if(selected){select(selected.getAttribute('data-node')||selected.dataset.select);return;}
 const mode=e.target.closest('[data-mode]');if(mode){setMode(mode.dataset.mode);return;}
 const view=e.target.closest('[data-view]');if(view){stop(false);state.view=view.dataset.view;render();return;}
 const step=e.target.closest('[data-step]');if(step){go(Number(step.dataset.step));return;}
 const rm=e.target.closest('[data-remove-edge]');if(rm){removeEdge(rm.dataset.removeEdge);return;}
 const a=e.target.closest('[data-action]');if(!a)return;
 const actions={edit:openEdit,question:openQuestion,'add-node':openAddNode,'add-edge':openAddEdge,'export-json':exportJson,'export-v1':exportProject,'export-md':()=>download('Mobius_Workshop_Notes.md',makeSummary(),'text/markdown'),import:()=>{$('import-file').value='';$('import-file').click();},list:()=>{state.view='list';render();},recover:()=>{download('Mobius_Previous_Storage.txt',state.brokenStorage||'','text/plain');toast('已生成原记录下载。旧记录仍保留；当前稿请导出完整备份。');}};
 try{actions[a.dataset.action]?.();}catch(err){toast(err.message||'操作未完成，请重试。');}
});
document.addEventListener('change',e=>{if(e.target.matches('[data-question]')){const q=state.project.questions.find(q=>q.id===e.target.dataset.question);if(q){checkpoint();q.done=e.target.checked;state.session.revision++;const kind=save();if(kind!=='saved')toast(B.saveFeedback(kind).toast,9000);}}});
document.addEventListener('keydown',e=>{if(e.target.closest('[data-node]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();select(e.target.closest('[data-node]').getAttribute('data-node'));return;}if($('modal').open||e.target.matches('input,textarea,select'))return;if(e.key===' '){e.preventDefault();togglePlay();}if(e.key==='ArrowRight'){e.preventDefault();go(state.index+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(state.index-1);}});
$('play-button').onclick=togglePlay;$('next-button').onclick=()=>go(state.index+1);$('previous-button').onclick=()=>go(state.index-1);$('reset-button').onclick=()=>go(0,false);
$('motion-button').onclick=()=>{state.reduced=!state.reduced;render();};$('fit-button').onclick=()=>{const wrap=$('scene-wrap');wrap.scrollTo({left:0,top:0,behavior:state.reduced?'auto':'smooth'});state.view='scene';render();};
$('files-button').onclick=openFiles;$('summary-button').onclick=openSummary;$('project-button').onclick=openProject;$('undo-button').onclick=undo;
$('import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>B.LIMITS.fileBytes)return toast(`文件超过 ${B.formatBytes(B.LIMITS.fileBytes)}，请选择结构化流程 JSON。`,7000);try{importText(await file.text());}catch(e){toast('文件读取失败，请重新选择。');}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.playing){stop();toast('离开页面时已暂停演示。');}});
window.addEventListener('pagehide',()=>stop(false));
media.addEventListener?.('change',e=>{if(e.matches){state.reduced=true;render();}});
$('modal').addEventListener('close',()=>{importDraft=null;});
// iPad soft keyboard shrinks only the visual viewport; keep the open form and its save button above it.
const vv=window.visualViewport;if(vv){const fitKeyboard=()=>{const root=document.documentElement;root.style.setProperty('--vv-height',vv.height+'px');root.style.setProperty('--vv-top',vv.offsetTop+'px');root.classList.toggle('keyboard-open',Math.abs(vv.scale-1)<.01&&window.innerHeight-vv.height>120);};vv.addEventListener('resize',fitKeyboard);vv.addEventListener('scroll',fitKeyboard);fitKeyboard();}
render();
if(state.brokenStorage)toast('发现无法读取的旧记录，暂未覆盖。请从导入 / 导出保存原文。');
})();
</script>
</body>
</html>
