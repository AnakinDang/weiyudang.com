<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="摆一摆">
<meta name="theme-color" content="#fbfaf5">
<meta name="robots" content="noindex">
<title>摆一摆 · 莫比乌斯原型</title>
<style>
:root{--bg:#f5f3ed;--ink:#263b39;--muted:#7b826e;--line:#e4e6dc;--green:#355c51;--shadow:0 12px 32px #28362c26}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{position:fixed;inset:0;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input{font-size:16px;-webkit-user-select:text;user-select:text}
.top{flex-shrink:0;min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:env(safe-area-inset-top) 16px 0;background:#fbfaf5;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#e7eadf;color:#4e6855;font-size:24px}
.brand b{display:block;font-size:15px}.brand small{display:block;font-size:11px;color:#7d867f}
.tools{display:flex;align-items:center;gap:8px}.stats{font-size:13px;color:var(--muted);margin-right:4px}
.btn{min-height:44px;min-width:44px;padding:0 14px;border-radius:12px;border:0;background:#f1f2ea;font-size:14px;font-weight:600;color:#4e6855}
.btn.on{background:#fbf1df;color:#9c703e}
.board{position:relative;flex:1;overflow:hidden;touch-action:none;background-color:#f8f7ef;background-image:radial-gradient(#e2dfd1 1.3px,transparent 1.3px);background-size:28px 28px}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:#a9b49e;stroke-width:2.5;stroke-dasharray:7 6}
.live{fill:none;stroke:#355c51;stroke-width:3.5;stroke-linecap:round}
.node{position:absolute;width:132px;display:flex;flex-direction:column;align-items:center;touch-action:none}
.av{position:relative;width:132px;height:82px}
.node.sel .av::before{content:"";position:absolute;left:8px;top:50px;width:116px;height:32px;border-radius:50%;background:#f6e7cc;border:2px dashed #cba56b}
.desk{position:absolute;left:22px;top:56px;width:88px;height:18px;border-radius:7px;background:#d5b78e}
.desk::after{content:"";position:absolute;right:12px;top:-6px;width:22px;height:12px;border-radius:2px;background:#fffdf4;border:1px solid #c99a62}
.body{position:absolute;left:43px;top:32px;width:46px;height:36px;border-radius:17px}
.head{position:absolute;left:51px;top:8px;width:30px;height:30px;border-radius:50%;background:#f2d3b8}
.hair{position:absolute;left:50px;top:4px;width:32px;height:17px;border-radius:50%;background:#3d3a36}
.badge{position:absolute;left:84px;top:22px;width:28px;height:28px;border-radius:50%;border:2.5px solid #fff;color:#fff;font-size:12px;font-weight:700;line-height:23px;text-align:center}
.label{margin-top:2px;min-width:96px;max-width:160px;padding:6px 10px 7px;background:#fff;border:1px solid #e1dfd4;border-radius:12px;text-align:center}
.label b{display:block;font-size:14px;font-weight:600;line-height:1.3}.label b.todo{color:#a3ab98;font-weight:500}
.label small{display:block;font-size:11px;color:var(--muted)}
.node.sel .label{border-color:#cba56b;box-shadow:0 0 0 3px #f6e7cc}
.node.ext .label{background:#f6f7f9}
.node.target .label{border-color:#6e8756;box-shadow:0 0 0 4px #cfe0c2}
.handle{position:absolute;left:112px;top:18px;width:48px;height:48px;border-radius:50%;background:var(--green);color:#fff;font-size:22px;font-weight:600;line-height:48px;text-align:center;box-shadow:0 4px 12px #233b3540}
.mini{position:absolute;top:-50px;left:50%;transform:translateX(-50%);display:flex;gap:6px;white-space:nowrap}
.mini button{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid #e1dfd4;background:#fff;font-size:13px;font-weight:600}
.pill{position:absolute;transform:translate(-50%,-50%);min-height:32px;padding:0 12px;border-radius:16px;background:#fffaf0;border:1px solid #dec49d;color:#9c703e;font-size:12px;font-weight:600;white-space:nowrap;display:flex;align-items:center;touch-action:none}
.pill.blank{color:#a3ab98;border-style:dashed;background:#fff;font-weight:500}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;text-align:center;padding:24px}
.empty h2{margin:0;font-size:26px}.empty p{margin:0;color:var(--muted);font-size:16px}
.steps{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}.steps span{padding:8px 14px;border-radius:18px;background:#fff;border:1px solid var(--line);font-size:14px;color:#4e5a50}
.fab{position:fixed;left:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;width:68px;height:68px;border-radius:50%;border:0;background:var(--green);color:#fffefb;font-size:34px;line-height:68px;box-shadow:0 6px 16px #233b3547}
.tray{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;width:min(920px,calc(100vw - 120px));background:#fffefb;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:14px 18px 16px}
.tray-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.tray-head b{font-size:18px}.tray-head .hint{font-size:12px;color:#8b9183}
.tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:#eceee5}.tabs button{min-height:36px;padding:0 14px;border:0;border-radius:9px;background:none;font-size:13px;color:var(--muted)}.tabs button.on{background:#fff;color:var(--ink);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:12px}
.card{position:relative;height:88px;border-radius:16px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:9px;touch-action:none}
.card .face{position:absolute;top:2px;left:50%;width:64px;height:52px;transform:translateX(-50%) scale(.82);transform-origin:50% 0}
.face .b{position:absolute;left:14px;top:25px;width:36px;height:26px;border-radius:13px}.face .h{position:absolute;left:21px;top:6px;width:22px;height:22px;border-radius:50%;background:#f2d3b8}.face .hr{position:absolute;left:20px;top:3px;width:24px;height:13px;border-radius:50%;background:#3d3a36}.face .g{position:absolute;left:42px;top:20px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;color:#fff;font-size:10px;font-weight:700;line-height:18px;text-align:center}
.card strong{font-size:14px}.card small{max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;color:#8b9183}
.card.pressed{background:#f3f6ee;border-color:#8b9e74}
.ghost{position:fixed;z-index:60;pointer-events:none;width:84px;height:88px;transform:translate(-50%,-62%) rotate(-5deg);box-shadow:var(--shadow)}
.pop{position:fixed;z-index:40;width:340px;background:#fffefb;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px 18px}
.pop h3{margin:0 0 4px;font-size:18px}.pop .sub{margin:0 0 12px;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #dce3d1;background:#fbfcf5;font-size:15px}
.chip.on{background:#e8f0e0;border:2px solid #8b9e74;color:#4f7042;font-weight:600}
.chip.add{border-style:dashed;background:#fff;color:#78817b}
.custom{display:flex;gap:8px;margin-top:10px}.custom input{flex:1;min-height:44px;padding:0 12px;border:1px solid #dce3d1;border-radius:12px;background:#fff}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.ok{min-height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--green);color:#fffefb;font-weight:600}
.quiet{min-height:44px;padding:0 16px;border:0;border-radius:12px;background:#f1f2ea;color:#4e6855;font-weight:600}
.danger{min-height:44px;padding:0 14px;border:0;border-radius:12px;background:#fcefe4;color:#b0612a;font-weight:600;margin-right:auto}
.note{margin:12px 0 0;font-size:12px;color:#8b9183;line-height:1.6}
.result{text-align:center}.result .big{font-size:40px;font-weight:700;margin:6px 0}.result .pass{color:#4f7042}.result .fail{color:#b0612a}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));z-index:70;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#344d3f;color:#fffff6;padding:12px 18px;border-radius:12px;font-size:14px;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){.stats,.brand small{display:none}.tray{width:calc(100vw - 24px);bottom:96px}}
</style>
</head>
<body>
<header class="top">
 <div class="brand"><span class="mark">∞</span><div><b>摆一摆 · 原型</b><small>只测手感：放人、连线、选任务</small></div></div>
 <div class="tools"><span id="stats" class="stats">0 人 · 0 条线</span><button id="timer" class="btn">计时测试</button><button id="undo" class="btn" aria-label="撤销">↶</button><button id="reset" class="btn">清空</button></div>
</header>
<main id="board" class="board">
 <div id="world" class="world">
  <svg id="links" class="links" width="10" height="10"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#a9b49e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g id="edges"></g><path id="live" class="live" d=""/></svg>
  <div id="pills"></div>
  <div id="nodes"></div>
 </div>
 <div id="empty" class="empty"><h2>从客户讲的第一个人开始</h2><p>“最近一笔业务，是谁最先动手的？”</p><div class="steps"><span>1 点 ＋ 选岗位</span><span>2 拖到地板上</span><span>3 点一个常做的事</span></div></div>
</main>
<button id="fab" class="fab" aria-label="加一个人">＋</button>
<section id="tray" class="tray" hidden>
 <div class="tray-head"><b>放谁上来？</b><div class="tabs"><button data-tab="in" class="on">公司里的人</button><button data-tab="out">外部</button></div><span class="hint">拖到地板上 · 已选中一个人时，点卡片＝接在它后面</span></div>
 <div id="cards" class="cards"></div>
</section>
<div id="pop" class="pop" hidden></div>
<div id="toast" class="toast" role="status"></div>
<script>
(function(){
'use strict';
// Throwaway prototype: tests whether "place people, connect handoffs" feels fast on an iPad. Not the product code.
const ROLES=[
 ['老板','老','#bf8d91','#936d70',0,['审批','看报表','定价']],
 ['店长','店','#d4a373','#a0703f',0,['排班','盘点','交日报']],
 ['销售','销','#e0a96d','#b07937',0,['接单','报价','开销售单','对账']],
 ['门店店员','员','#cd9765','#9c693d',0,['收银','交当天销售单','退换货']],
 ['客服','服','#a091ba','#77638e',0,['售后','退换','回访']],
 ['运营','运','#899e65','#657749',0,['汇总各店销售','查缺补件','做报表','对接商场']],
 ['采购','采','#78a89c','#557e78',0,['下采购单','跟单','到货验收']],
 ['仓库','仓','#9b8c74','#6f6352',0,['收货','发货','调拨','盘点']],
 ['财务','财','#5b9a9b','#397485',0,['核对销售与结算','开票','记账','付款审批']],
 ['出纳','出','#6fa3b8','#3f7186',0,['收款','付款','对银行流水']],
 ['客户','客','#9aa6b6','#6b7a8f',1,['下单','付款']],
 ['供应商','供','#9aa6b6','#6b7a8f',1,['发货','开票']],
 ['商场/平台','商','#9aa6b6','#6b7a8f',1,['出结算单','扣费']],
 ['银行','银','#9aa6b6','#6b7a8f',1,['到账','回单']],
 ['物流','物','#9aa6b6','#6b7a8f',1,['提货','签收']]
];
const R=Object.fromEntries(ROLES.map(r=>[r[0],{name:r[0],badge:r[1],shirt:r[2],ink:r[3],ext:!!r[4],tasks:r[5]}]));
const DOCS=['销售单','销售汇总','结算单','扣费明细','发票','到账记录','对账表','日报','Excel 表','微信截图'];
const KEY='mobius.builder.spike.v1', NW=132, AH=82;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'_'+Math.random().toString(36).slice(2,9);
const board=$('board'),world=$('world');
let state=load()||{nodes:[],edges:[]},view={x:40,y:40,k:1},sel=null,history=[],tab='in',timer=null,gesture=null,toastT;
const pts=new Map();

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&Array.isArray(s.nodes)&&Array.isArray(s.edges)?s:null;}catch(e){return null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast('没有保存成功：浏览器存储不可用');}}
function commit(){history.push(JSON.stringify(state));if(history.length>50)history.shift();}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2600);}
const byId=id=>state.nodes.find(n=>n.id===id);
const center=n=>({x:n.x+NW/2,y:n.y+AH/2+4});
function toWorld(cx,cy){const r=board.getBoundingClientRect();return {x:(cx-r.left-view.x)/view.k,y:(cy-r.top-view.y)/view.k};}
function applyView(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`;board.style.backgroundPosition=`${view.x}px ${view.y}px`;board.style.backgroundSize=`${28*view.k}px ${28*view.k}px`;}
// Each direction bends to its own side, so A→B and a return B→A do not overlap.
function curve(a,b){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,nx=-uy,ny=ux,r=54;
 const p1={x:a.x+ux*r,y:a.y+uy*r},p2={x:b.x-ux*(r+4),y:b.y-uy*(r+4)},c=Math.min(120,len*0.3),bend=24;
 return {d:`M${p1.x},${p1.y} C${p1.x+ux*c+nx*bend},${p1.y+uy*c+ny*bend} ${p2.x-ux*c+nx*bend},${p2.y-uy*c+ny*bend} ${p2.x},${p2.y}`,mid:{x:(p1.x+p2.x)/2+nx*bend*0.75,y:(p1.y+p2.y)/2+ny*bend*0.75}};}

function nodeHtml(n){const r=R[n.role]||R['运营'],on=n.id===sel;
 return `<div class="node${on?' sel':''}${r.ext?' ext':''}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px"><div class="av"><span class="desk"></span><span class="body" style="background:${r.shirt}"></span><span class="head"></span><span class="hair"></span><span class="badge" style="background:${r.ink}">${esc(r.badge)}</span></div><div class="label"><b class="${n.title?'':'todo'}">${esc(n.title||'在做什么？')}</b><small>${esc(n.role)}</small></div>${on?`<div class="handle" data-handle="${n.id}" aria-label="拖到另一个人，连一条交接">→</div><div class="mini"><button data-act="task">改任务</button><button data-act="del">删除</button></div>`:''}</div>`;}
function renderLinks(){let html='',pills='';
 for(const e of state.edges){const a=byId(e.from),b=byId(e.to);if(!a||!b)continue;const c=curve(center(a),center(b));html+=`<path class="edge" d="${c.d}" marker-end="url(#arrow)"/>`;pills+=`<div class="pill${e.label?'':' blank'}" data-edge="${e.id}" style="left:${c.mid.x}px;top:${c.mid.y}px">${esc(e.label||'交什么？')}</div>`;}
 $('edges').innerHTML=html;$('pills').innerHTML=pills;}
function render(){$('nodes').innerHTML=state.nodes.map(nodeHtml).join('');renderLinks();applyView();$('empty').hidden=state.nodes.length>0;stats();}
function stats(){$('stats').textContent=`${state.nodes.length} 人 · ${state.edges.length} 条线`;}

// ---------- placing people ----------
function freeSpot(x,y){let p={x,y},tries=0;while(tries++<12&&state.nodes.some(n=>Math.abs(n.x-p.x)<120&&Math.abs(n.y-p.y)<150))p={x:p.x,y:p.y+170};return p;}
function place(role,wx,wy,from){commit();const p=freeSpot(Math.round(wx-NW/2),Math.round(wy-AH/2));const n={id:uid('n'),role,title:'',x:p.x,y:p.y};state.nodes.push(n);
 if(from)state.edges.push({id:uid('e'),from,to:n.id,label:''});sel=n.id;save();render();ensureVisible(n);openTask(n.id,from);tick();}
// Visible board area in world coordinates, excluding the open tray.
function visibleWorld(){const r=board.getBoundingClientRect(),trayH=$('tray').hidden?0:$('tray').offsetHeight+24;return {l:-view.x/view.k,t:-view.y/view.k,r:(r.width-view.x)/view.k,b:(r.height-trayH-view.y)/view.k};}
function tapPlace(role){const s=byId(sel),v=visibleWorld();
 if(s){const right=s.x+210;if(right+NW+60<=v.r)place(role,right+NW/2,s.y+AH/2,s.id);else place(role,v.l+40+NW/2,s.y+AH/2+200,s.id);return;}
 place(role,v.l+(v.r-v.l)*0.16,v.t+(v.b-v.t)*0.22,null);}
// Pan just enough that a newly placed person is on screen.
function ensureVisible(n){const v=visibleWorld(),m=30;let dx=0,dy=0;if(n.x+NW+60>v.r-m)dx=(v.r-m)-(n.x+NW+60);if(n.x<v.l+m)dx=(v.l+m)-n.x;if(n.y+170>v.b-m)dy=(v.b-m)-(n.y+170);if(n.y-60<v.t+m)dy=(v.t+m)-(n.y-60);
 if(dx||dy){view.x+=dx*view.k;view.y+=dy*view.k;applyView();}}
function link(from,to){if(from===to)return;if(state.edges.some(e=>e.from===from&&e.to===to)){toast('这两个人之间已经有这条交接');return;}
 commit();const e={id:uid('e'),from,to,label:''};state.edges.push(e);save();render();openDoc(e.id);tick();}
function removeNode(id){commit();state.nodes=state.nodes.filter(n=>n.id!==id);state.edges=state.edges.filter(e=>e.from!==id&&e.to!==id);sel=null;closePop();save();render();tick();}

// ---------- popovers ----------
function showPop(html,anchor){const p=$('pop');p.innerHTML=html;p.hidden=false;const w=p.offsetWidth,h=p.offsetHeight,trayH=$('tray').hidden?0:$('tray').offsetHeight+24;
 let x=anchor.x+16,y=anchor.y-40;if(x+w>innerWidth-12)x=anchor.x-w-16;x=Math.max(12,Math.min(x,innerWidth-w-12));y=Math.max(72,Math.min(y,innerHeight-h-12-trayH));p.style.left=x+'px';p.style.top=y+'px';}
function closePop(){$('pop').hidden=true;$('pop').innerHTML='';}
// Anchor right of the connect handle so the popover never covers it.
function screenOf(n){const r=board.getBoundingClientRect();return {x:r.left+view.x+(n.x+NW+34)*view.k,y:r.top+view.y+n.y*view.k+40};}
function openTask(id,from){const n=byId(id),r=R[n.role];
 showPop(`<h3>${esc(r.name)}在做什么？</h3><p class="sub">点一个最常做的事，之后还能改</p><div class="chips">${r.tasks.map(t=>`<button class="chip${n.title===t?' on':''}" data-task="${esc(t)}">${esc(t)}</button>`).join('')}<button class="chip add" data-custom="task">＋ 自己写</button></div><div class="custom" hidden><input maxlength="40" placeholder="例如：把销售单拍照发群里"><button class="ok" data-save="task">好</button></div>${from?`<p class="note">已从「${esc(byId(from).title||byId(from).role)}」连过来；交什么单据，点线上的标签再补。</p>`:''}<div class="row"><button class="quiet" data-close>跳过</button></div>`,screenOf(n));
 $('pop').dataset.kind='task';$('pop').dataset.id=id;}
function openDoc(edgeId){const e=state.edges.find(x=>x.id===edgeId);if(!e)return;const a=byId(e.from),b=byId(e.to),c=curve(center(a),center(b)),r=board.getBoundingClientRect();
 showPop(`<h3>${esc(a.title||a.role)} 交给 ${esc(b.title||b.role)} 的是？</h3><p class="sub">可以跳过，之后再补</p><div class="chips">${DOCS.map(d=>`<button class="chip${e.label===d?' on':''}" data-doc="${esc(d)}">${esc(d)}</button>`).join('')}<button class="chip add" data-custom="doc">＋ 自己写</button></div><div class="custom" hidden><input maxlength="40" placeholder="例如：退货联"><button class="ok" data-save="doc">好</button></div><div class="row"><button class="danger" data-del-edge>删掉这条线</button><button class="quiet" data-close>跳过</button></div>`,{x:r.left+view.x+c.mid.x*view.k,y:r.top+view.y+c.mid.y*view.k});
 $('pop').dataset.kind='doc';$('pop').dataset.id=edgeId;}
$('pop').addEventListener('click',ev=>{const t=ev.target.closest('button');if(!t)return;const pop=$('pop'),id=pop.dataset.id;
 if(t.dataset.task!==undefined){commit();byId(id).title=t.dataset.task;save();closePop();render();return;}
 if(t.dataset.doc!==undefined){commit();state.edges.find(e=>e.id===id).label=t.dataset.doc;save();closePop();render();return;}
 if(t.dataset.custom){pop.querySelector('.custom').hidden=false;pop.querySelector('input').focus();return;}
 if(t.dataset.save){const v=pop.querySelector('input').value.trim();if(!v)return;commit();if(t.dataset.save==='task')byId(id).title=v;else state.edges.find(e=>e.id===id).label=v;save();closePop();render();return;}
 if(t.hasAttribute('data-del-edge')){commit();state.edges=state.edges.filter(e=>e.id!==id);save();closePop();render();tick();return;}
 if(t.hasAttribute('data-again')){closePop();startTimer();return;}
 if(t.hasAttribute('data-clear')){commit();state={nodes:[],edges:[]};sel=null;save();closePop();render();tick();return;}
 if(t.hasAttribute('data-close'))closePop();});
$('pop').addEventListener('keydown',ev=>{if(ev.key==='Enter'){const b=$('pop').querySelector('[data-save]');if(b)b.click();}});

// ---------- board gestures: pan, pinch, move, connect ----------
const capture=(el,id)=>{try{el.setPointerCapture(id);}catch(e){}};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function nodeAt(cx,cy){for(const el of document.elementsFromPoint(cx,cy)){const n=el.closest&&el.closest('.node');if(n)return byId(n.dataset.id);}return null;}
function markTarget(id){document.querySelectorAll('.node.target').forEach(el=>el.classList.remove('target'));if(id){const el=document.querySelector(`.node[data-id="${id}"]`);if(el)el.classList.add('target');}}
board.addEventListener('pointerdown',e=>{
 if(e.target.closest('.mini button'))return;
 e.preventDefault();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pts.size===2){const [a,b]=[...pts.values()],r=board.getBoundingClientRect();gesture={type:'pinch',d0:dist(a,b)||1,k0:view.k,m0:{x:(a.x+b.x)/2-r.left,y:(a.y+b.y)/2-r.top},v0:{...view}};$('live').setAttribute('d','');markTarget(null);return;}
 if(pts.size>2)return;
 const h=e.target.closest('[data-handle]'),nd=e.target.closest('.node'),pill=e.target.closest('.pill');
 if(h)gesture={type:'link',id:e.pointerId,from:h.dataset.handle};
 else if(nd){const n=byId(nd.dataset.id);gesture={type:'node',id:e.pointerId,n,sx:e.clientX,sy:e.clientY,ox:n.x,oy:n.y,moved:false,el:nd};}
 else if(pill)gesture={type:'pill',id:e.pointerId,edge:pill.dataset.edge,sx:e.clientX,sy:e.clientY};
 else gesture={type:'pan',id:e.pointerId,sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y,moved:false};
 capture(board,e.pointerId);});
board.addEventListener('pointermove',e=>{
 if(!pts.has(e.pointerId)||!gesture)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(gesture.type==='pinch'){if(pts.size<2)return;const [a,b]=[...pts.values()],r=board.getBoundingClientRect(),k=Math.max(0.45,Math.min(1.8,gesture.k0*dist(a,b)/gesture.d0)),m={x:(a.x+b.x)/2-r.left,y:(a.y+b.y)/2-r.top};
  const wx=(gesture.m0.x-gesture.v0.x)/gesture.v0.k,wy=(gesture.m0.y-gesture.v0.y)/gesture.v0.k;view={k,x:m.x-wx*k,y:m.y-wy*k};applyView();return;}
 if(gesture.id!==e.pointerId)return;
 if(gesture.type==='pan'){const dx=e.clientX-gesture.sx,dy=e.clientY-gesture.sy;if(Math.hypot(dx,dy)>5)gesture.moved=true;view.x=gesture.vx+dx;view.y=gesture.vy+dy;applyView();}
 else if(gesture.type==='node'){const dx=e.clientX-gesture.sx,dy=e.clientY-gesture.sy;if(!gesture.moved){if(Math.hypot(dx,dy)<8)return;gesture.moved=true;commit();closePop();}
  gesture.n.x=Math.round(gesture.ox+dx/view.k);gesture.n.y=Math.round(gesture.oy+dy/view.k);gesture.el.style.left=gesture.n.x+'px';gesture.el.style.top=gesture.n.y+'px';renderLinks();}
 else if(gesture.type==='link'){const a=center(byId(gesture.from)),w=toWorld(e.clientX,e.clientY);$('live').setAttribute('d',`M${a.x},${a.y} L${w.x},${w.y}`);const t=nodeAt(e.clientX,e.clientY);markTarget(t&&t.id!==gesture.from?t.id:null);}
});
function end(e){
 if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
 if(!gesture)return;
 if(gesture.type==='pinch'){if(!pts.size)gesture=null;return;}
 if(gesture.id!==e.pointerId)return;
 const g=gesture;gesture=null;
 if(g.type==='pan'){if(!g.moved){sel=null;closePop();render();}}
 else if(g.type==='node'){if(g.moved){save();render();}else{sel=g.n.id;render();if(!g.n.title)openTask(g.n.id);else closePop();}}
 else if(g.type==='link'){$('live').setAttribute('d','');markTarget(null);if(e.type==='pointercancel')return;const t=nodeAt(e.clientX,e.clientY);if(t&&t.id!==g.from)link(g.from,t.id);}
 else if(g.type==='pill'){if(Math.hypot(e.clientX-g.sx,e.clientY-g.sy)<10)openDoc(g.edge);}
}
board.addEventListener('pointerup',end);board.addEventListener('pointercancel',end);
board.addEventListener('click',e=>{const b=e.target.closest('.mini button');if(!b)return;const id=b.closest('.node').dataset.id;if(b.dataset.act==='del')removeNode(id);else openTask(id);});

// ---------- tray: tap or drag a role card ----------
function renderCards(){$('cards').innerHTML=ROLES.filter(r=>(tab==='out')===!!r[4]).map(r=>`<div class="card" data-role="${esc(r[0])}"><div class="face"><span class="b" style="background:${r[2]}"></span><span class="h"></span><span class="hr"></span><span class="g" style="background:${r[3]}">${esc(r[1])}</span></div><strong>${esc(r[0])}</strong><small>${esc(r[5].slice(0,2).join(' · '))}</small></div>`).join('');}
let drag=null;
$('cards').addEventListener('pointerdown',e=>{const c=e.target.closest('.card');if(!c)return;e.preventDefault();c.classList.add('pressed');drag={role:c.dataset.role,id:e.pointerId,sx:e.clientX,sy:e.clientY,ghost:null,card:c};capture($('cards'),e.pointerId);});
$('cards').addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;if(!drag.ghost){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<10)return;drag.ghost=drag.card.cloneNode(true);drag.ghost.classList.add('ghost');drag.ghost.classList.remove('pressed');document.body.appendChild(drag.ghost);}
 drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';});
function endDrag(e){if(!drag||drag.id!==e.pointerId)return;const d=drag;drag=null;d.card.classList.remove('pressed');
 if(!d.ghost){if(e.type==='pointerup')tapPlace(d.role);return;}
 d.ghost.remove();if(e.type==='pointercancel')return;
 const br=board.getBoundingClientRect(),tr=$('tray').getBoundingClientRect(),inBoard=e.clientX>br.left&&e.clientX<br.right&&e.clientY>br.top&&e.clientY<br.bottom,inTray=e.clientX>tr.left&&e.clientX<tr.right&&e.clientY>tr.top&&e.clientY<tr.bottom;
 if(!inBoard||inTray){toast('放到地板上才算');return;}const w=toWorld(e.clientX,e.clientY);place(d.role,w.x,w.y,null);}
$('cards').addEventListener('pointerup',endDrag);$('cards').addEventListener('pointercancel',endDrag);
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));renderCards();});
$('fab').addEventListener('click',()=>{const open=$('tray').hidden;$('tray').hidden=!open;$('fab').textContent=open?'×':'＋';closePop();});

// ---------- timer test: 5 people and 5 handoffs ----------
const mmss=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function startTimer(){timer={t0:Date.now(),n0:state.nodes.length,e0:state.edges.length,iv:setInterval(tick,250)};$('timer').classList.add('on');tick();toast('开始计时：放 5 个人、连 5 条线');}
function stopTimer(){clearInterval(timer.iv);timer=null;$('timer').classList.remove('on');$('timer').textContent='计时测试';}
function tick(){stats();if(!timer)return;const dn=state.nodes.length-timer.n0,de=state.edges.length-timer.e0,s=(Date.now()-timer.t0)/1000;$('timer').textContent=`${mmss(s)} · ${Math.max(0,dn)}/5 人 · ${Math.max(0,de)}/5 线`;
 if(dn>=5&&de>=5){stopTimer();const pass=s<=120;showPop(`<div class="result"><h3>完成</h3><div class="big ${pass?'pass':'fail'}">${mmss(s)}</div><p class="sub">${pass?'2 分钟内放完 5 个人、连好 5 条线，达标。':'超过 2 分钟。记一下是哪一步慢、哪里点错了。'}</p><div class="row" style="justify-content:center"><button class="quiet" data-close>关闭</button><button class="ok" data-again>再试一次</button></div></div>`,{x:innerWidth/2-170,y:innerHeight/2-120});}}
$('timer').addEventListener('click',()=>{if(timer){stopTimer();toast('已停止计时');}else startTimer();});
$('undo').addEventListener('click',()=>{if(!history.length){toast('没有可撤销的操作');return;}state=JSON.parse(history.pop());sel=null;closePop();save();render();tick();});
$('reset').addEventListener('click',()=>showPop('<h3>清空沙盘？</h3><p class="sub">可以用 ↶ 撤销。</p><div class="row"><button class="quiet" data-close>取消</button><button class="ok" data-clear>清空</button></div>',{x:innerWidth-370,y:80}));
addEventListener('resize',()=>closePop());
renderCards();render();
})();
</script>
</body>
</html>
